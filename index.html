<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR7 MARKET — شحن ألعاب رقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080a;
    --bg-soft:#0f0f13;
    --panel:#111114;
    --gold-1:#f4d675;
    --gold-2:#d4a017;
    --gold-3:#8a6a12;
    --ink:#f2efe6;
    --ink-dim:#a8a49a;
    --line:#232227;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ambient glow */
  .glow-a{
    position:fixed; top:-20%; right:-10%; width:60vw; height:60vw;
    background:radial-gradient(circle, rgba(212,160,23,0.16) 0%, rgba(212,160,23,0) 65%);
    pointer-events:none; z-index:0;
  }
  .glow-b{
    position:fixed; bottom:-25%; left:-15%; width:70vw; height:70vw;
    background:radial-gradient(circle, rgba(244,214,117,0.08) 0%, rgba(244,214,117,0) 60%);
    pointer-events:none; z-index:0;
  }

  main{
    position:relative; z-index:1;
    max-width:560px;
    margin:0 auto;
    padding:56px 24px 64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* logo */
  .brand{
    display:flex; flex-direction:column; align-items:center;
    opacity:0; animation:riseIn .7s ease-out forwards;
  }
  .logo-ring{
    width:104px; height:104px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#000;
    box-shadow:0 0 0 1px var(--gold-2), 0 0 34px 2px rgba(212,160,23,0.35);
    overflow:hidden;
  }
  .logo-ring img{width:100%; height:100%; object-fit:cover;}
  .brand-name{
    margin-top:16px;
    font-weight:800;
    font-size:15px;
    letter-spacing:.5px;
    color:var(--gold-1);
  }
  .brand-name span{color:var(--ink-dim); font-weight:500;}

  /* headline */
  .hero-text{
    margin-top:36px;
    opacity:0; animation:riseIn .7s ease-out .12s forwards;
  }
  h1{
    font-size:clamp(28px,7vw,38px);
    line-height:1.28;
    font-weight:800;
    color:var(--ink);
  }
  h1 em{
    font-style:normal;
    background:linear-gradient(95deg, var(--gold-1), var(--gold-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{
    margin-top:16px;
    font-size:16px;
    line-height:1.8;
    color:var(--ink-dim);
    max-width:420px;
  }

  /* showcase */
  .showcase{
    margin-top:44px;
    width:100%;
    opacity:0; animation:riseIn .7s ease-out .24s forwards;
  }
  .frame-wrap{
    position:relative;
    width:240px; height:240px;
    margin:0 auto;
  }
  .frame{
    position:absolute; inset:0;
    clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
    background:var(--panel);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .frame::before{
    content:"";
    position:absolute; inset:0;
    box-shadow: inset 0 0 0 1px rgba(244,214,117,0.15);
    pointer-events:none;
  }
  .corner{
    position:absolute; width:20px; height:20px;
    border-color:var(--gold-2);
    z-index:2;
  }
  .corner.tl{top:0; right:0; border-top:2px solid; border-right:2px solid;}
  .corner.br{bottom:0; left:0; border-bottom:2px solid; border-left:2px solid;}

  .slide{
    position:absolute; inset:0;
    opacity:0;
    transition:opacity .5s ease;
  }
  .slide.active{opacity:1;}
  .slide img{
    width:100%; height:100%; object-fit:cover;
  }

  .game-label{
    margin-top:20px;
    font-size:18px;
    font-weight:700;
    color:var(--ink);
    min-height:26px;
  }
  .dots{
    margin-top:12px;
    display:flex;
    justify-content:center;
    gap:8px;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--line);
    transition:background .3s ease, transform .3s ease;
  }
  .dot.active{
    background:var(--gold-1);
    transform:scale(1.3);
  }

  .games-list{
    margin-top:18px;
    font-size:14.5px;
    color:var(--ink-dim);
    line-height:1.9;
  }
  .games-list b{color:var(--ink); font-weight:600;}

  /* CTA */
  .cta-wrap{
    margin-top:48px;
    width:100%;
    opacity:0; animation:riseIn .7s ease-out .36s forwards;
  }
  .cta{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:16px 34px;
    background:linear-gradient(95deg, var(--gold-1), var(--gold-2));
    color:#151005;
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size:16px;
    text-decoration:none;
    border-radius:10px;
    box-shadow:0 10px 30px -8px rgba(212,160,23,0.55);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .cta:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 34px -6px rgba(212,160,23,0.7);
  }
  .cta svg{width:20px; height:20px; flex-shrink:0;}

  .handle{
    margin-top:18px;
    font-size:13.5px;
    color:var(--ink-dim);
    letter-spacing:.3px;
    direction:ltr;
  }
  .handle a{color:var(--gold-1); text-decoration:none;}

  footer{
    margin-top:56px;
    font-size:12.5px;
    color:#5c5a55;
    opacity:0; animation:riseIn .7s ease-out .46s forwards;
  }

  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (prefers-reduced-motion: reduce){
    .brand,.hero-text,.showcase,.cta-wrap,footer{animation:none; opacity:1;}
    .slide{transition:none;}
  }

  a.cta:focus-visible, a.handle-link:focus-visible{
    outline:2px solid var(--gold-1);
    outline-offset:3px;
  }
</style>
</head>
